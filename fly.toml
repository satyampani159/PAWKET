[app]
name = "pawket-backend"
primary_region = "bom"  # Mumbai — closest to India

[build]
  dockerfile = "backend/Dockerfile"

[env]
  ML_MODELS_DIR = "ml/models"
  DATABASE_URL = "sqlite:///./finance.db"
  CORS_ORIGINS = "*"
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

# Secrets to set via: fly secrets set GROQ_API_KEY=gsk_xxx
# GROQ_API_KEY is set as a Fly.io secret, not in this file
